<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cars 3 Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-darkest:#08080c;--bg-dark:#0d0d12;--bg-mid:#13131a;--bg-light:#1a1a24;
  --border:#252530;--border-light:#303040;
  --text:#d0d0d8;--text-dim:#888898;--text-muted:#555568;
  --accent:#c32721;--accent-hover:#e04040;--accent-glow:rgba(195,39,33,0.25);
  --bone-color:#ff8c00;--wire-color:#00e5ff;--grid-color:#3355aa;
  --radius:6px;--radius-sm:4px;
  --shadow:0 2px 8px rgba(0,0,0,0.5);
  --transition:0.15s ease;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg-darkest);color:var(--text);height:100vh;overflow:hidden;display:flex}
#sidebar{width:300px;background:var(--bg-dark);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar-content{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar-section{padding:4px 0}
.sidebar-section h2{padding:8px 16px;font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--border)}
.btn{display:block;width:100%;text-align:left;padding:7px 16px;border:none;background:none;color:var(--text-dim);font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);text-overflow:ellipsis;overflow:hidden;white-space:nowrap;transition:background var(--transition),color var(--transition)}
.btn:hover{background:var(--bg-light);color:#fff}
.btn.active{background:var(--bg-light);color:var(--accent)}
.btn .ext{color:var(--text-muted);font-size:10px;margin-left:4px}
.btn .size{color:var(--text-muted);font-size:10px;float:right}
.dir-btn{color:#aaa}
.dir-btn::before{content:'\25B6 ';font-size:9px;color:var(--text-muted)}
.breadcrumb{padding:6px 12px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border);background:var(--bg-dark)}
.breadcrumb a{color:var(--text-dim);text-decoration:none;cursor:pointer}
.breadcrumb a:hover{color:var(--accent)}
.search-box{padding:8px;border-bottom:1px solid var(--border)}
.search-box input{width:100%;padding:6px 10px;border:1px solid var(--border);background:var(--bg-dark);color:var(--text);border-radius:var(--radius-sm);font-size:12px;transition:border-color var(--transition)}
.search-box input:focus{outline:none;border-color:var(--accent)}
#viewport{flex:1;position:relative;background:var(--bg-darkest);display:flex;flex-direction:column}
#viewer-area{flex:1;position:relative}
#viewer-area.hidden{display:none}
#file-area{flex:1;overflow:auto;padding:16px;display:none;background:var(--bg-dark)}
#file-area.active{display:block}
#file-header{padding:8px 16px;background:var(--bg-mid);border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:center;gap:8px}
#file-header .fname{color:var(--accent);font-weight:600}
#file-header .fsize{color:var(--text-muted)}
#file-content{padding:16px;font-size:12px;white-space:pre-wrap;word-break:break-all;font-family:'SF Mono',Consolas,monospace;line-height:1.5;color:var(--text-dim)}
#file-content img{max-width:100%;border-radius:var(--radius)}
#file-content audio{width:100%;margin-top:8px}
.file-note{color:var(--accent);margin:8px 0;font-style:italic}
#info{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(8,8,12,0.88);backdrop-filter:blur(8px);padding:8px 14px;border-radius:var(--radius);font-size:11px;color:var(--text-dim);pointer-events:none;z-index:5;border:1px solid var(--border)}
#toolbar{position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(13,13,18,0.92);backdrop-filter:blur(8px);padding:6px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border)}
#toolbar button{padding:4px 10px;border:1px solid var(--border);background:var(--bg-light);color:var(--text-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:11px;transition:all var(--transition)}
#toolbar button:hover{background:var(--border-light);color:#fff;border-color:var(--border-light)}
#toolbar button.active{background:var(--accent);border-color:var(--accent);color:#fff}
#toolbar .title{font-size:13px;font-weight:600;color:var(--accent)}
#toolbar .sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
#toolbar label{color:var(--text-dim);font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:var(--text-muted)}
.tex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;padding:8px}
.tex-grid canvas{width:100%;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;transition:border-color var(--transition)}
.tex-grid canvas:hover{border-color:var(--accent)}
.tex-label{font-size:9px;color:var(--text-muted);text-align:center;overflow:hidden;text-overflow:ellipsis}
.zip-table{width:100%;border-collapse:collapse}
.zip-table td{padding:4px 8px;border-bottom:1px solid var(--border);font-size:11px}
.zip-table tr:hover{background:var(--bg-light)}
.zip-table .zname{color:var(--text-dim);cursor:pointer}
.zip-table .zname:hover{color:var(--accent)}
.zip-table .zsize{color:var(--text-muted);text-align:right}
.hex-dump{font-family:'SF Mono',Consolas,monospace;font-size:10px;line-height:1.4;color:var(--text-dim);word-break:break-all;background:var(--bg-darkest);padding:12px;border-radius:var(--radius);border:1px solid var(--border)}
.model-section h2{padding:8px 16px;font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--border);background:var(--bg-mid);cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
.model-section h2:hover{color:var(--accent)}
.model-section.collapsed .model-section-items{display:none}
.model-section-items{max-height:40vh;overflow-y:auto}
#sidebar-header{padding:0;border-bottom:1px solid var(--border);flex-direction:column}
#banner-wrap{position:relative;width:100%;height:64px;overflow:hidden;background:var(--bg-darkest)}
#banner-wrap img{width:100%;height:100%;object-fit:cover;filter:brightness(0.5) saturate(0.7)}
#banner-overlay{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(90deg,rgba(8,8,12,0.9) 0%,rgba(8,8,12,0.4) 60%,transparent 100%)}
#logo-img{height:44px;width:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.8))}
#app-title{font-size:13px;font-weight:700;color:var(--text);text-shadow:0 1px 4px rgba(0,0,0,0.9);letter-spacing:0.5px}
#tab-bar{display:flex;gap:0;padding:0}
#tab-bar button{flex:1;padding:6px 3px;border:none;border-top:1px solid var(--border);background:var(--bg-mid);color:var(--text-muted);font-size:10px;font-weight:600;cursor:pointer;transition:all var(--transition)}
#tab-bar button:hover{background:var(--bg-light);color:#ccc}
#tab-bar button.active{background:var(--bg-light);color:var(--accent);border-top:2px solid var(--accent)}
.scripts-panel{padding:0}
.scripts-list{max-height:calc(100vh - 200px);overflow-y:auto}
.scripts-list .btn{font-size:11px;padding:4px 10px}
.scripts-list .btn .ext{color:var(--accent)}
.scripts-category{padding:4px 0;border-bottom:1px solid var(--border)}
.scripts-category h4{padding:4px 12px;font-size:10px;color:var(--accent);cursor:pointer;user-select:none;background:var(--bg-dark);position:sticky;top:0;z-index:1}
.scripts-category h4:hover{color:var(--accent-hover)}
.scripts-category.collapsed .scripts-category-items{display:none}
.scripts-category-items{max-height:300px;overflow-y:auto}
.mod-panel{padding:0}
.mod-section{border-bottom:1px solid var(--border)}
.mod-section h3{padding:6px 12px;font-size:11px;color:var(--accent);background:var(--bg-dark);cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.mod-section h3:hover{color:var(--accent-hover)}
.mod-section h3 .chevron{font-size:8px;color:var(--text-muted)}
.mod-section-body{padding:6px 10px}
.mod-section.collapsed .mod-section-body{display:none}
.mod-btn{display:inline-block;padding:3px 8px;border:1px solid var(--border);background:var(--bg-light);color:var(--text-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:10px;font-weight:600;margin:2px;transition:all var(--transition)}
.mod-btn:hover{background:var(--border-light);color:#fff}
.mod-btn.primary{background:#5a1515;border-color:var(--accent);color:#e0d6c6}
.mod-btn.primary:hover{background:var(--accent);color:#fff}
.mod-btn.export{background:#1a2a2a;border-color:#4a7b80;color:#c8d5e0}
.mod-btn.export:hover{background:#4a7b80;color:#fff}
#mod-workspace-list{max-height:200px;overflow-y:auto}
#mod-workspace-list .btn{font-size:11px;padding:4px 10px}
#mod-workspace-list .btn .ext{color:var(--accent)}
#romfs-extract-list{max-height:250px;overflow-y:auto}
#romfs-extract-list .btn{font-size:11px;padding:4px 10px}
#script-editor{width:100%;height:180px;background:var(--bg-darkest);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;font-family:'SF Mono',Consolas,monospace;font-size:11px;line-height:1.4;resize:vertical;transition:border-color var(--transition)}
#script-editor:focus{outline:none;border-color:var(--accent)}
#compile-status{font-size:10px;padding:4px 0;min-height:14px}
#compile-status.ok{color:#4a7b80}
#compile-status.err{color:var(--accent)}
.mod-export-wrap{padding:8px 10px}
.mod-export-wrap input{width:100%;padding:4px 8px;border:1px solid var(--border);background:var(--bg-darkest);color:var(--text);border-radius:var(--radius-sm);font-size:11px;margin-bottom:6px;transition:border-color var(--transition)}
.mod-export-wrap input:focus{outline:none;border-color:var(--accent)}
#mod-romfs-source{width:100%;padding:4px 8px;border:1px solid var(--border);background:var(--bg-darkest);color:var(--text);border-radius:var(--radius-sm);font-size:11px;margin-bottom:6px;transition:border-color var(--transition)}
#mod-romfs-source:focus{outline:none;border-color:var(--accent)}
.mod-toast{position:fixed;bottom:20px;right:20px;background:var(--bg-light);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:var(--radius);font-size:12px;z-index:9999;box-shadow:var(--shadow);animation:fadeInOut 2s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <div id="banner-wrap">
      <img src="banner.png" alt="Cars 3">
      <div id="banner-overlay">
        <img id="logo-img" src="logo.png" alt="Logo">
        <span id="app-title">Cars 3 Explorer</span>
      </div>
    </div>
    <div id="tab-bar">
      <button class="active" onclick="showTab('models')" id="tab-models">Models</button>
      <button onclick="showTab('files')" id="tab-files">Romfs</button>
      <button onclick="showTab('scripts')" id="tab-scripts">Scripts</button>
      <button onclick="showTab('mod')" id="tab-mod">Mod</button>
      <button onclick="showTab('search')" id="tab-search">Search</button>
    </div>
  </div>
  <div id="sidebar-content">
    <div id="panel-models">
      <div id="model-sections"></div>
    </div>
    <div id="panel-files" style="display:none">
      <div id="breadcrumb" class="breadcrumb"><a onclick="browseRomfs('')">romfs</a></div>
      <div id="fileList"></div>
    </div>
    <div id="panel-mod" style="display:none">
      <div class="mod-panel">
        <div class="mod-section" id="mod-workspace-section">
          <h3 onclick="this.parentElement.classList.toggle('collapsed')">Workspace <span class="chevron">&#9660;</span></h3>
          <div class="mod-section-body">
            <div id="mod-workspace-list"><div style="padding:8px;color:#556;font-size:11px">Loading...</div></div>
            <div style="padding:4px 0"><button class="mod-btn" onclick="modRefreshWorkspace()">Refresh</button></div>
          </div>
        </div>
        <div class="mod-section" id="mod-editor-section">
          <h3 onclick="this.parentElement.classList.toggle('collapsed')">Script Editor <span class="chevron">&#9660;</span></h3>
          <div class="mod-section-body">
            <div style="margin-bottom:4px">
              <select id="script-romfs-select" style="width:100%;padding:3px 6px;background:var(--bg-darkest);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:10px;margin-bottom:4px">
                <option value="">-- Load from romfs --</option>
              </select>
              <button class="mod-btn" onclick="modLoadSelectedScript()">Load</button>
              <button class="mod-btn" onclick="modSaveScript()">Save</button>
              <button class="mod-btn primary" onclick="modCompileScript()">Compile</button>
            </div>
            <textarea id="script-editor" spellcheck="false" placeholder="-- Lua script editor --"></textarea>
            <div id="compile-status"></div>
            <div style="font-size:9px;color:#555;padding:2px 0">Files: <span id="script-file-name">untitled.lua</span></div>
          </div>
        </div>
        <div class="mod-section" id="mod-extract-section">
          <h3 onclick="this.parentElement.classList.toggle('collapsed')">Extract from Game <span class="chevron">&#9660;</span></h3>
          <div class="mod-section-body">
            <div style="font-size:10px;color:#777;margin-bottom:4px">Extract files from any game ZIP into workspace</div>
              <select id="mod-romfs-source" onchange="modLoadZipList(this.value)" style="width:100%;padding:3px 6px;background:var(--bg-darkest);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:10px;margin-bottom:4px">
              <option value="">-- Select ZIP --</option>
            </select>
            <div id="romfs-extract-list"><div style="padding:8px;color:#556;font-size:11px">Select a ZIP above</div></div>
          </div>
        </div>
        <div class="mod-section" id="mod-export-section">
          <h3 onclick="this.parentElement.classList.toggle('collapsed')">Export Mod <span class="chevron">&#9660;</span></h3>
          <div class="mod-section-body">
            <div style="font-size:10px;color:#777;margin-bottom:4px">Package workspace files into a Ryujinx mod</div>
            <input id="mod-export-name" placeholder="Mod name" value="cars3_mod" style="width:100%;padding:4px 8px;background:#0a0a0a;color:#d0d0d0;border:1px solid #2a2a2a;border-radius:3px;font-size:11px;margin-bottom:4px">
            <button class="mod-btn export" onclick="modExportRyujinx()" style="width:100%;padding:6px">Export for Ryujinx</button>
            <div id="export-status" style="font-size:10px;padding:4px 0;color:#4a7b80"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="panel-scripts" style="display:none">
      <div class="scripts-panel">
        <div class="search-box"><input id="scriptFilterInput" placeholder="Filter scripts..." oninput="filterScripts(this.value)"></div>
        <div id="scripts-list" class="scripts-list"><div style="padding:12px;color:#555;font-size:11px">Loading scripts...</div></div>
      </div>
    </div>
    <div id="panel-search" style="display:none">
      <div class="search-box"><input id="searchInput" placeholder="Search romfs files..." onkeydown="if(event.key==='Enter')doSearch()"></div>
      <div id="searchResults"></div>
    </div>
  </div>
</div>
<div id="viewport">
  <div id="viewer-area">
    <div id="toolbar">
      <span class="title" id="modelName">Select a character</span>
      <div class="sep"></div>
      <button onclick="toggleWireframe()" id="btnWire" title="W">Wireframe</button>
      <button onclick="toggleBones()" id="btnBone" title="B">Bones</button>
      <button onclick="toggleGrid()" id="btnGrid" class="active" title="G">Grid</button>
      <button onclick="toggleSpin()" id="btnSpin" title="Space">Spin</button>
      <button onclick="resetCamera()" title="R">Reset</button>
      <div class="sep"></div>
      <label>
        <input type="checkbox" id="deswizzleToggle" checked onchange="reloadCurrentModel()"> Deswizzle
      </label>
      <div style="flex:1"></div>
      <button onclick="exportGLTF()" title="Export scene as glTF">Export</button>
      <button onclick="document.getElementById('importGLTF').click()" title="Import a .gltf/.glb file">Import</button>
      <input type="file" id="importGLTF" accept=".gltf,.glb" style="display:none" onchange="importGLTF(this)">
    </div>
    <div id="loading"></div>
    <div id="info"></div>
  </div>
  <div id="file-area">
    <div id="file-header"></div>
    <div id="file-content"></div>
  </div>
</div>

<script src="three.min.js"></script>
<script src="bc7_decoder.js"></script>
<script>
// Change this to your remote backend URL when deploying (e.g., "https://your-backend.onrender.com")
// Or leave it as "http://localhost:8766" if you run cars3_viewer.py locally.
const API_BASE_URL = "";

// ── State ──
let scene, camera, renderer, modelGroup;
let isSpinning = false, isWireframe = false, isBonesVisible = false, isGridVisible = true;
let theta = 0, phi = Math.PI/4, radius = 5;
let targetX = 0, targetY = 0, targetZ = 0;
let mouseDown = false, prevMX = 0, prevMY = 0;
let currentTab = 'models';
let currentPath = '';
let currentModelData = null;
let gridHelper = null;
let boneHelper = null;
let currentSkeleton = null;

// ── Three.js init ──
function initViewport() {
  const el = document.getElementById('viewer-area');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d1a);
  camera = new THREE.PerspectiveCamera(40, el.clientWidth/el.clientHeight, 0.01, 200);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(el.clientWidth, el.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  el.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const dl = new THREE.DirectionalLight(0xffffff, 1.8);
  dl.position.set(5,10,7); dl.castShadow = true; scene.add(dl);
  scene.add(new THREE.DirectionalLight(0xffffff,0.8).translateX(-5).translateZ(-5));
  scene.add(new THREE.DirectionalLight(0x88bbff,0.3).translateX(-3).translateY(1).translateZ(5));
  scene.add(new THREE.HemisphereLight(0x88bbff, 0x886633, 0.6));
  gridHelper = new THREE.GridHelper(8, 16, 0x4488ff, 0x3355aa);
  scene.add(gridHelper);

  renderer.domElement.addEventListener('mousedown', e=>{if(e.button===0){mouseDown=true;prevMX=e.clientX;prevMY=e.clientY;}});
  window.addEventListener('mousemove', e=>{
    if(!mouseDown)return;
    theta-=(e.clientX-prevMX)*0.01;
    phi=Math.max(0.1,Math.min(Math.PI-0.1,phi+(e.clientY-prevMY)*0.01));
    prevMX=e.clientX;prevMY=e.clientY;updateCamera();
  });
  window.addEventListener('mouseup',()=>mouseDown=false);
  renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(0.5,Math.min(50,radius+e.deltaY*0.005));updateCamera();},{passive:false});

  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='w'||e.key==='W')toggleWireframe();
    else if(e.key==='b'||e.key==='B')toggleBones();
    else if(e.key==='g'||e.key==='G')toggleGrid();
    else if(e.key==='r'||e.key==='R')resetCamera();
    else if(e.key===' '){e.preventDefault();toggleSpin();}
  });
  updateCamera();
  animate();
}

function updateCamera(){
  camera.position.x=targetX+radius*Math.sin(phi)*Math.sin(theta);
  camera.position.y=targetY+radius*Math.cos(phi);
  camera.position.z=targetZ+radius*Math.sin(phi)*Math.cos(theta);
  camera.lookAt(targetX,targetY,targetZ);
}

function animate(){
  requestAnimationFrame(animate);
  if(isSpinning&&modelGroup){
    modelGroup.rotation.y+=0.008;
    if(boneHelper&&boneHelper.visible&&currentSkeleton) rebuildBoneVis();
  }
  renderer.render(scene,camera);
}

function rebuildBoneVis(){
  if(!boneHelper||!currentSkeleton) return;
  const pos=boneHelper.geometry.getAttribute('position');
  if(!pos) return;
  let idx=0;
  function updateBones(obj){
    if(obj.isBone){
      obj.updateWorldMatrix(true,false);
      const wp=new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld);
      if(obj.parent&&obj.parent.isBone){
        const pp=new THREE.Vector3().setFromMatrixPosition(obj.parent.matrixWorld);
        pos.array[idx++]=wp.x;pos.array[idx++]=wp.y;pos.array[idx++]=wp.z;
        pos.array[idx++]=pp.x;pos.array[idx++]=pp.y;pos.array[idx++]=pp.z;
      }
    }
    for(const c of obj.children) updateBones(c);
  }
  if(modelGroup){
    modelGroup.updateMatrixWorld(true);
    updateBones(modelGroup);
  }
  pos.needsUpdate=true;
}

// ── Sidebar tabs ──
function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tab-bar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('panel-models').style.display = tab==='models'?'':'none';
  document.getElementById('panel-files').style.display = tab==='files'?'':'none';
  document.getElementById('panel-scripts').style.display = tab==='scripts'?'':'none';
  document.getElementById('panel-mod').style.display = tab==='mod'?'':'none';
  document.getElementById('panel-search').style.display = tab==='search'?'':'none';
  if(tab==='files' && !currentPath) browseRomfs('');
  if(tab==='mod') modInit();
  if(tab==='scripts') loadScriptsPanel();
}

// ── Romfs browser ──
async function browseRomfs(path){
  currentPath = path;
  const el = document.getElementById('fileList');
  el.innerHTML = '<div style="padding:12px;color:#556">Loading...</div>';
  const bc = document.getElementById('breadcrumb');
  const parts = path ? path.split('/') : [];
  let html = '<a onclick="browseRomfs(\'\')">romfs</a>';
  let cumul = '';
  for(const p of parts){
    cumul += (cumul?'/':'')+p;
    const pp = cumul;
    html += ' / <a onclick="browseRomfs(\''+pp+'\')">'+p+'</a>';
  }
  bc.innerHTML = html;
  try{
    const r = await fetch(API_BASE_URL + '/api/browse?path='+encodeURIComponent(path));
    const d = await r.json();
    if(d.error){el.innerHTML='<div style="padding:12px;color:#cc4444">'+d.error+'</div>';return;}
    let h = '';
    const dirs = d.entries.filter(e=>e.type==='dir');
    const files = d.entries.filter(e=>e.type==='file');
    for(const e of dirs){
      h+='<button class="btn dir-btn" onclick="browseRomfs(\''+path+'/'+e.name+'\')">'+e.name+'</button>';
    }
    for(const e of files){
      const sz = e.size>1048576?(e.size/1048576).toFixed(1)+'M':e.size>1024?(e.size/1024).toFixed(0)+'K':e.size+'B';
      const click = getClickHandler(path, e);
      h+='<button class="btn" onclick="'+click+'">'+e.name+'<span class="size">'+sz+'</span></button>';
    }
    if(!dirs.length && !files.length) h='<div style="padding:16px;color:#556">Empty directory</div>';
    el.innerHTML = h;
  }catch(e){el.innerHTML='<div style="padding:12px;color:#cc4444">'+e.message+'</div>';}
}

function getClickHandler(path, entry){
  const full = path ? path+'/'+entry.name : entry.name;
  const ext = entry.ext.toLowerCase();
  if(ext==='.zip') return 'openZip(\''+esc(full)+'\')';
  if(ext==='.tbody'||ext==='.mtb') return 'openFile(\''+esc(full)+'\')';
  if(ext==='.oct') return 'openFile(\''+esc(full)+'\')';
  if(ext==='.wem'||ext==='.bnk'||ext==='.pck') return 'openFile(\''+esc(full)+'\')';
  if(ext==='.bik') return 'openFile(\''+esc(full)+'\')';
  if(ext==='.png'||ext==='.jpg'||ext==='.bmp') return 'openFile(\''+esc(full)+'\')';
  if(ext==='.bin'||ext==='.vbuf'||ext==='.ibuf'||ext==='.bent'||ext==='.bct'||ext==='.banm') return 'openFile(\''+esc(full)+'\')';
  return 'openFile(\''+esc(full)+'\')';
}

    el.textContent = d.content;
  } else if(d.type==='image'){
    el.innerHTML='<img src="data:'+d.mimeType+';base64,'+d.data+'">';
  } else if(d.type==='audio'){
    const playable = d.ext==='.wem';
    if(playable){
      el.innerHTML='<div class="file-note">Wwise audio (may not play in browser)</div><audio controls src="data:'+d.mimeType+';base64,'+d.data+'"></audio>';
    } else {
      el.innerHTML='<div class="file-note">Audio format: '+d.ext+' ('+formatSize(d.size)+')</div><div class="hex-dump">'+d.data.substring(0,500)+'...</div>';
    }
  } else if(d.type==='binary'){
    let html='<div class="file-note">Binary: '+d.ext+' ('+formatSize(d.size)+')</div>';
    if(d.hexPreview) html+='<div class="hex-dump">'+formatHex(d.hexPreview)+'</div>';
    if(d.data) html+='<div style="margin-top:8px"><button onclick="downloadBlob(\''+d.name+'\',\''+d.data+'\')" style="padding:6px 12px;border:1px solid #3a3d5e;background:#1a1c2e;color:#aabbdd;border-radius:3px;cursor:pointer">Download</button></div>';
    el.innerHTML=html;
  } else if(d.type==='zip'){
    let html='<table class="zip-table"><tr><th>Name</th><th style="text-align:right">Size</th><th style="text-align:right">Compressed</th></tr>';
    for(const e of d.entries){
      const ext=e.name.split('.').pop().toLowerCase();
      const click='openZipFile(\''+esc(d.path)+'\',\''+esc(e.name)+'\')';
      html+='<tr><td class="zname" onclick="'+click+'">'+e.name+'</td><td class="zsize">'+formatSize(e.size)+'</td><td class="zsize">'+formatSize(e.compressed)+'</td></tr>';
    }
    html+='</table>';
    el.innerHTML=html;
  } else {
    el.innerHTML='<div class="hex-dump">'+JSON.stringify(d,null,2)+'</div>';
  }
}

function downloadBlob(name, b64){
  const bin=atob(b64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const blob=new Blob([arr]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

function formatSize(b){if(b>1048576)return(b/1048576).toFixed(1)+'MB';if(b>1024)return(b/1024).toFixed(0)+'KB';return b+'B';}
function formatHex(hex){let h='';for(let i=0;i<hex.length;i+=2){if(i>0&&i%32===0)h+='\n';h+=hex.substr(i,2)+' ';}return h;}

// ── IEEE 754 float16 ──
function f16(h){
  const s=(h>>15)&1,e=(h>>10)&0x1f,m=h&0x3ff;
  if(e===0)return(s?-1:1)*Math.pow(2,-14)*(m/1024);
  if(e===31)return m===0?(s?-Infinity:Infinity):NaN;
  return(s?-1:1)*Math.pow(2,e-15)*(1+m/1024);
}

// ── BC3/DXT5 texture decoder ──
function rgb565ToRgb(val){return[((val>>11)&0x1f)*8,((val>>5)&0x3f)*4,(val&0x1f)*8];}

function decodeBC3Block(data, off){
  const a0=data[off],a1=data[off+1];
  const ai0=(data[off+2]>>>0)|((data[off+3]>>>0)<<8)|((data[off+4]>>>0)<<16);
  const ai1=(data[off+5]>>>0)|((data[off+6]>>>0)<<8)|((data[off+7]>>>0)<<16);
  const c0Val=data[off+8]|(data[off+9]<<8);
  const c1Val=data[off+10]|(data[off+11]<<8);
  const c0=rgb565ToRgb(c0Val);
  const c1=rgb565ToRgb(c1Val);
  const colorIdx=data[off+12]|(data[off+13]<<8)|(data[off+14]<<16)|(data[off+15]<<24);

  const alphaTable=new Uint8Array(8);
  if(a0>a1){
    alphaTable[0]=a0;alphaTable[7]=a1;
    for(let i=1;i<7;i++)alphaTable[i]=((7-i)*a0+i*a1)/7|0;
  }else{
    alphaTable[0]=a0;alphaTable[7]=a1;
    for(let i=1;i<5;i++)alphaTable[i]=((5-i)*a0+i*a1)/5|0;
    alphaTable[5]=0;alphaTable[6]=255;
  }

  const cTable=new Uint8Array(12);
  if(c0Val>c1Val){
    cTable[0]=c0[0];cTable[1]=c0[1];cTable[2]=c0[2];
    cTable[3]=(2*c0[0]+c1[0])/3|0;cTable[4]=(2*c0[1]+c1[1])/3|0;cTable[5]=(2*c0[2]+c1[2])/3|0;
    cTable[6]=(c0[0]+2*c1[0])/3|0;cTable[7]=(c0[1]+2*c1[1])/3|0;cTable[8]=(c0[2]+2*c1[2])/3|0;
    cTable[9]=c1[0];cTable[10]=c1[1];cTable[11]=c1[2];
  }else{
    cTable[0]=c0[0];cTable[1]=c0[1];cTable[2]=c0[2];
    cTable[3]=(c0[0]+c1[0])/2|0;cTable[4]=(c0[1]+c1[1])/2|0;cTable[5]=(c0[2]+c1[2])/2|0;
    cTable[6]=c1[0];cTable[7]=c1[1];cTable[8]=c1[2];
    cTable[9]=0;cTable[10]=0;cTable[11]=0;
  }

  const pixels=new Uint8Array(64);
  for(let i=0;i<16;i++){
    const ci=(colorIdx>>>(2*i))&3;
    const aiBits=i<8?(ai0>>>(3*i))&7:(ai1>>>(3*(i-8)))&7;
    pixels[i*4]=cTable[ci*3];pixels[i*4+1]=cTable[ci*3+1];pixels[i*4+2]=cTable[ci*3+2];pixels[i*4+3]=alphaTable[aiBits];
  }
  return pixels;
}

function decodeBC1Block(data, off){
  const c0Val=data[off]|(data[off+1]<<8);
  const c1Val=data[off+2]|(data[off+3]<<8);
  const c0=rgb565ToRgb(c0Val);
  const c1=rgb565ToRgb(c1Val);
  const colorIdx=data[off+4]|(data[off+5]<<8)|(data[off+6]<<16)|(data[off+7]<<24);
  const cTable=new Uint8Array(12);
  if(c0Val>c1Val){
    cTable[0]=c0[0];cTable[1]=c0[1];cTable[2]=c0[2];
    cTable[3]=(2*c0[0]+c1[0])/3|0;cTable[4]=(2*c0[1]+c1[1])/3|0;cTable[5]=(2*c0[2]+c1[2])/3|0;
    cTable[6]=(c0[0]+2*c1[0])/3|0;cTable[7]=(c0[1]+2*c1[1])/3|0;cTable[8]=(c0[2]+2*c1[2])/3|0;
    cTable[9]=c1[0];cTable[10]=c1[1];cTable[11]=c1[2];
  }else{
    cTable[0]=c0[0];cTable[1]=c0[1];cTable[2]=c0[2];
    cTable[3]=(c0[0]+c1[0])/2|0;cTable[4]=(c0[1]+c1[1])/2|0;cTable[5]=(c0[2]+c1[2])/2|0;
    cTable[6]=c1[0];cTable[7]=c1[1];cTable[8]=c1[2];
    cTable[9]=0;cTable[10]=0;cTable[11]=0;
  }
  const pixels=new Uint8Array(64);
  for(let i=0;i<16;i++){
    const ci=(colorIdx>>>(2*i))&3;
    pixels[i*4]=cTable[ci*3];pixels[i*4+1]=cTable[ci*3+1];pixels[i*4+2]=cTable[ci*3+2];pixels[i*4+3]=255;
  }
  return pixels;
}

function decodeBC4Block(data, off){
  const r0=data[off],r1=data[off+1];
  const idx=BigInt(data[off+2])|(BigInt(data[off+3])<<8n)|(BigInt(data[off+4])<<16n)|(BigInt(data[off+5])<<24n)|(BigInt(data[off+6])<<32n)|(BigInt(data[off+7])<<40n);
  const table=new Uint8Array(8);
  if(r0>r1){table[0]=r0;table[7]=r1;for(let i=1;i<7;i++)table[i]=((7-i)*r0+i*r1)/7|0;}
  else{table[0]=r0;table[7]=r1;for(let i=1;i<5;i++)table[i]=((5-i)*r0+i*r1)/5|0;table[5]=0;table[6]=255;}
  const pixels=new Uint8Array(64);
  for(let i=0;i<16;i++){const ci=Number((idx>>(3n*BigInt(i)))&7n);pixels[i*4]=table[ci];pixels[i*4+1]=table[ci];pixels[i*4+2]=table[ci];pixels[i*4+3]=255;}
  return pixels;
}

function decodeBC5Block(data, off){
  const r0=data[off],r1=data[off+1];
  const rIdx=BigInt(data[off+2])|(BigInt(data[off+3])<<8n)|(BigInt(data[off+4])<<16n)|(BigInt(data[off+5])<<24n)|(BigInt(data[off+6])<<32n)|(BigInt(data[off+7])<<40n);
  const rTable=new Uint8Array(8);
  if(r0>r1){rTable[0]=r0;rTable[7]=r1;for(let i=1;i<7;i++)rTable[i]=((7-i)*r0+i*r1)/7|0;}
  else{rTable[0]=r0;rTable[7]=r1;for(let i=1;i<5;i++)rTable[i]=((5-i)*r0+i*r1)/5|0;rTable[5]=0;rTable[6]=255;}
  const g0=data[off+8],g1=data[off+9];
  const gIdx=BigInt(data[off+10])|(BigInt(data[off+11])<<8n)|(BigInt(data[off+12])<<16n)|(BigInt(data[off+13])<<24n)|(BigInt(data[off+14])<<32n)|(BigInt(data[off+15])<<40n);
  const gTable=new Uint8Array(8);
  if(g0>g1){gTable[0]=g0;gTable[7]=g1;for(let i=1;i<7;i++)gTable[i]=((7-i)*g0+i*g1)/7|0;}
  else{gTable[0]=g0;gTable[7]=g1;for(let i=1;i<5;i++)gTable[i]=((5-i)*g0+i*g1)/5|0;gTable[5]=0;gTable[6]=255;}
  const pixels=new Uint8Array(64);
  for(let i=0;i<16;i++){
    const ri=Number((rIdx>>(3n*BigInt(i)))&7n);
    const gi=Number((gIdx>>(3n*BigInt(i)))&7n);
    const nx=(rTable[ri]/255.0)*2.0-1.0;
    const ny=(gTable[gi]/255.0)*2.0-1.0;
    const nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
    pixels[i*4]=rTable[ri];pixels[i*4+1]=gTable[gi];
    pixels[i*4+2]=((nz+1)*0.5*255)|0;pixels[i*4+3]=255;
  }
  return pixels;
}

function decodeTextureBlock(data, off, format){
  switch(format){
    case 'BC3': return decodeBC3Block(data, off);
    case 'BC1': return decodeBC1Block(data, off);
    case 'BC4': return decodeBC4Block(data, off);
    case 'BC5': return decodeBC5Block(data, off);
    case 'BC7': return null; // handled via bc7_decoder.js
    case 'RGBA8': return null; // raw RGBA, no block decoding needed
    default: return decodeBC3Block(data, off);
  }
}

function getTextureBlockSize(format){
  switch(format){
    case 'BC1': return 8;
    case 'BC4': return 8;
    case 'BC3': return 16;
    case 'BC5': return 16;
    case 'BC7': return 16;
    case 'RGBA8': return 0; // raw pixels, not block-compressed
    default: return 16;
  }
}

function deswizzleSurface(data, width, height, blockSize){
  const bx=Math.ceil(width/4), by=Math.ceil(height/4);
  const totalBytes=bx*by*blockSize;
  const out=new Uint8Array(totalBytes);
  const gobH=8, gobW=64, gobSize=gobW*gobH;
  const bpg=gobW/blockSize;
  const gx=Math.ceil(bx/bpg), gy=Math.ceil(by/gobH);
  for(let gobY=0;gobY<gy;gobY++){
    for(let gobX=0;gobX<gx;gobX++){
      const gobIdx=gobY*gx+gobX;
      const sBase=gobIdx*gobSize;
      const lBaseY=(gobY*gobH)*bx*blockSize;
      const lBaseX=gobX*bpg*blockSize;
      for(let row=0;row<gobH;row++){
        for(let col=0;col<gobW;col++){
          const sx=sBase+deswizzleGobOffset(col,row);
          const blockInRow=col/blockSize|0;
          const offsetInBlock=col%blockSize;
          const blockY=gobY*gobH+row;
          const blockX=gobX*bpg+blockInRow;
          if(blockX<bx&&blockY<by){
            const lx=lBaseY+blockY*bx*blockSize+lBaseX+blockInRow*blockSize+offsetInBlock;
            if(sx<data.length&&lx<out.length)out[lx]=data[sx];
          }
        }
      }
    }
  }
  return out;
}

function deswizzleGobOffset(x,y){
  return (x/32|0)*256+(y/2|0)*64+((x%32)/16|0)*32+(y&1)*16+(x&15);
}

function deswizzleRGBA8(data, width, height){
  const bpp=4;
  const gobW=64, gobH=8, gobSize=gobW*gobH;
  const bpg=gobW/bpp;
  const bx=width, by=height;
  const gx=Math.ceil(bx/bpg), gy=Math.ceil(by/gobH);
  const totalBytes=bx*by*bpp;
  const out=new Uint8Array(totalBytes);
  for(let gobY=0;gobY<gy;gobY++){
    for(let gobX=0;gobX<gx;gobX++){
      const gobIdx=gobY*gx+gobX;
      const sBase=gobIdx*gobSize;
      for(let row=0;row<gobH;row++){
        for(let col=0;col<gobW;col++){
          const sx=sBase+deswizzleGobOffset(col,row);
          const pixelInRow=col/bpp|0;
          const pixY=gobY*gobH+row;
          const pixX=gobX*bpg+pixelInRow;
          if(pixX<bx&&pixY<by){
            const lx=(pixY*bx+pixX)*bpp;
            if(sx+bpp<=data.length&&lx+bpp<=out.length){
              out[lx]=data[sx];out[lx+1]=data[sx+1];out[lx+2]=data[sx+2];out[lx+3]=data[sx+3];
            }
          }
        }
      }
    }
  }
  return out;
}

function deswizzleBlockLinear(data, width, height, blockSize, blockHeightInGobs){
  // Switch Tegra block-linear deswizzle
  if(!blockHeightInGobs) blockHeightInGobs=16;
  const gobW=64, gobH=8;
  const gobSize=gobW*gobH;
  const bx=Math.ceil(width/4), by=Math.ceil(height/4);
  const bytesPerRow=bx*blockSize;
  const wig=(bytesPerRow+gobW-1)/gobW|0;
  const hig=(by+gobH-1)/gobH|0;
  const out=new Uint8Array(data.length);
  for(let gobY=0;gobY<hig;gobY++){
    for(let gobX=0;gobX<wig;gobX++){
      const gobIdx=(gobY/blockHeightInGobs|0)*wig*blockHeightInGobs+gobX*blockHeightInGobs+(gobY%blockHeightInGobs);
      const gobOff=gobIdx*gobSize;
      for(let line=0;line<gobH;line++){
        const blockY=gobY*gobH+line;
        if(blockY*4>=height)continue;
        for(let bxOff=0;bxOff<gobW;bxOff+=blockSize){
          const blockX=(gobX*gobW+bxOff)/blockSize|0;
          if(blockX>=bx)continue;
          const srcIdx=gobOff+line*gobW+bxOff;
          const dstIdx=(blockY*bx+blockX)*blockSize;
          if(srcIdx+blockSize<=data.length&&dstIdx+blockSize<=out.length){
            for(let bi=0;bi<blockSize;bi++) out[dstIdx+bi]=data[srcIdx+bi];
          }
        }
      }
    }
  }
  return out;
}

function decodeTextureToCanvas(data, width, height, format){
  try{
  const blockSize = getTextureBlockSize(format);

  // Deswizzle Switch Tegra block-linear data before decoding
  if(document.getElementById('deswizzleToggle')&&document.getElementById('deswizzleToggle').checked){
    if(format==='RGBA8'&&blockSize===0){
      try{data=deswizzleRGBA8(data,width,height);}catch(e){}
    }else if(blockSize>0){
      try{data=deswizzleBlockLinear(data,width,height,blockSize,16);}catch(e){
        try{data=deswizzleBlockLinear(data,width,height,blockSize,8);}catch(e2){
          try{data=deswizzleSurface(data,width,height,blockSize);}catch(e3){}
        }
      }
    }
  }

  // Special handling for BC7
  if(format === 'BC7'){
    try { return decodeBC7Texture(data, width, height); } catch(e) {}
    return createFallbackTexture('BC7');
  }
  
  // Special handling for raw RGBA8
  if(format === 'RGBA8'){
    const canvas=document.createElement('canvas');
    canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d');
    const img=ctx.createImageData(width,height);
    const dst=img.data;
    for(let i=0;i<width*height*4&&i<data.byteLength;i++){
      dst[i]=data[i];
    }
    ctx.putImageData(img,0,0);
    return canvas;
  }
  
  if(blockSize === 0) return null;
  
  const bx=Math.ceil(width/4), by=Math.ceil(height/4);
  const canvas=document.createElement('canvas');
  canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d');
  const img=ctx.createImageData(width,height);
  const dst=img.data;
  for(let iy=0;iy<by;iy++){
    for(let ix=0;ix<bx;ix++){
      const off=(iy*bx+ix)*blockSize;
      if(off+blockSize>data.length)continue;
      const p=decodeTextureBlock(data,off,format);
      if(!p) continue;
      for(let py=0;py<4;py++){
        for(let px=0;px<4;px++){
          const x=ix*4+px,y=iy*4+py;
          if(x<width&&y<height){
            const si=(py*4+px)*4;
            const di=(y*width+x)*4;
            dst[di]=p[si];dst[di+1]=p[si+1];dst[di+2]=p[si+2];dst[di+3]=p[si+3];
          }
        }
      }
    }
  }
  ctx.putImageData(img,0,0);
  return canvas;
  }catch(e){
    const canvas=document.createElement('canvas');
    canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#888888';
    ctx.fillRect(0,0,width,height);
    return canvas;
  }
}

// ── Decode one buffer group ──
function decodeGroup(vbufB64, ibufB64, primitives, skinIndicesB64, skinWeightsB64){
  const vbuf=Uint8Array.from(atob(vbufB64),c=>c.charCodeAt(0));
  const ibuf=ibufB64?Uint8Array.from(atob(ibufB64),c=>c.charCodeAt(0)):null;
  const dv=new DataView(vbuf.buffer);
  const skinIdxBytes=skinIndicesB64?Uint8Array.from(atob(skinIndicesB64),c=>c.charCodeAt(0)):null;
  const skinWgtBytes=skinWeightsB64?Uint8Array.from(atob(skinWeightsB64),c=>c.charCodeAt(0)):null;
  const hasSkin=skinIdxBytes&&skinWgtBytes;
  const meshes=[];
  let skinOffset=0;
  for(let pi=0;pi<primitives.length;pi++){
    const prim=primitives[pi];
    const [numStreams,vertCount,_p0,offsetA,strideA]=prim.vdata;
    const [ibRef,byteOffset,baseIndex,indexCount]=prim.idata;
    const ub=prim.unitBase,us=prim.unitScale;
    const indexWidth=prim.indexWidth||2;
    const positions=[];
    for(let i=0;i<vertCount;i++){
      const off=offsetA+i*strideA;
      if(off+6>vbuf.length)break;
      const x16=dv.getInt16(off,true),y16=dv.getInt16(off+2,true),z16=dv.getInt16(off+4,true);
      positions.push(ub[0]+(x16/32767.0)*us[0],ub[1]+(y16/32767.0)*us[1],ub[2]+(z16/32767.0)*us[2]);
    }
    const uvs=[];
    const uvOffCandidates = [];
    if(strideA >= 16) uvOffCandidates.push(10, 12, 8, 6);
    else if(strideA >= 12) uvOffCandidates.push(8, 10, 6);
    else if(strideA >= 10) uvOffCandidates.push(6, 8);
    else if(strideA >= 8) uvOffCandidates.push(6);
    let bestUVs=null, bestScore=-1;
    for(const uvOff of uvOffCandidates){
      if(uvOff+4>strideA) continue;
      const candidates=[
        {fn:(u,v)=>[u/32767.0,1.0-v/32767.0]},
        {fn:(u,v)=>[u/65535.0,1.0-v/65535.0]},
        {fn:(u,v)=>[f16(u),1.0-f16(v)]},
        {fn:(u,v)=>[u/2048.0,1.0-v/2048.0]},
      ];
      for(const fmt of candidates){
        const testUVs=[];let inRange=0;
        let minU=1e9,maxU=-1e9,minV=1e9,maxV=-1e9;
        for(let i=0;i<vertCount;i++){
          const off=offsetA+i*strideA+uvOff;
          if(off+4>vbuf.length)break;
          const rawU=dv.getUint16(off,true),rawV=dv.getUint16(off+2,true);
          const[u,v]=fmt.fn(rawU,rawV);
          testUVs.push(u,v);
          if(u>=-0.1&&u<=1.1&&v>=-0.1&&v<=1.1)inRange++;
          if(u<minU)minU=u;if(u>maxU)maxU=u;if(v<minV)minV=v;if(v>maxV)maxV=v;
        }
        const span=(maxU-minU)+(maxV-minV);
        const coverage=(span>0.3&&span<4.0)?50:0;
        const score=inRange+coverage;
        if(score>bestScore&&inRange>vertCount*0.3){bestScore=score;bestUVs=testUVs;}
      }
    }
    if(bestUVs)for(const v of bestUVs)uvs.push(v);
    const indices=[];
    if(ibuf&&indexCount>0){
      const idv=new DataView(ibuf.buffer,ibuf.byteOffset);
      if(indexWidth===2){for(let i=0;i<indexCount;i++){const off=byteOffset+i*2;if(off+2>ibuf.length)break;indices.push(idv.getUint16(off,true)-baseIndex);}}
      else if(indexWidth===4){for(let i=0;i<indexCount;i++){const off=byteOffset+i*4;if(off+4>ibuf.length)break;indices.push(idv.getUint32(off,true)-baseIndex);}}
      else if(indexWidth===1){for(let i=0;i<indexCount;i++){const off=byteOffset+i;if(off>=ibuf.length)break;indices.push(ibuf[off]-baseIndex);}}
    }
    if(positions.length<9||indices.length<3){skinOffset+=vertCount*4;continue;}
    const meshObj={
      name:prim.material,
      displayName:prim.materialDisplayName||prim.material,
      materialRef:prim.materialRef!=null&&prim.materialRef>=0?prim.materialRef:pi%Math.max(1,primitives.length),
      positions:new Float32Array(positions),
      uvs:new Float32Array(uvs),
      indices:indices.length>0&&Math.max(...indices)>65535?new Uint32Array(indices):new Uint16Array(indices),
    };
    if(hasSkin&&vertCount>0){
      const mIdx=new Uint8Array(vertCount*4);
      const mWgt=new Float32Array(vertCount*4);
      const bytesPerVert=4;
      for(let vi=0;vi<vertCount;vi++){
        const si=(skinOffset+vi)*bytesPerVert;
        if(si+4<=skinIdxBytes.length){
          mIdx[vi*4]=skinIdxBytes[si];mIdx[vi*4+1]=skinIdxBytes[si+1];
          mIdx[vi*4+2]=skinIdxBytes[si+2];mIdx[vi*4+3]=skinIdxBytes[si+3];
        }
        if(si+4<=skinWgtBytes.length){
          mWgt[vi*4]=skinWgtBytes[si]/255;mWgt[vi*4+1]=skinWgtBytes[si+1]/255;
          mWgt[vi*4+2]=skinWgtBytes[si+2]/255;mWgt[vi*4+3]=skinWgtBytes[si+3]/255;
        }
      }
      meshObj.skinIndices=new Uint8Array(mIdx);
      meshObj.skinWeights=mWgt;
    }
    skinOffset+=vertCount;
    meshes.push(meshObj);
  }
  return meshes;
}

// ── Build Three.js model ──
function buildModel(allMeshes, textureMap, materials, matTexMap, armatureData){
  if(modelGroup){
    scene.remove(modelGroup);
    modelGroup.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose();}});
  }
  if(boneHelper){scene.remove(boneHelper);boneHelper=null;}
  currentSkeleton=null;
  modelGroup=new THREE.Group();
  let totalVerts=0,totalTris=0;

  const texList=Object.values(textureMap);
  const diffuseTextures=texList.filter(t=>t.slot===0).sort((a,b)=>a.mtbIndex-b.mtbIndex);
  const allTexturesByIndex={};
  for(const t of texList) allTexturesByIndex[t.mtbIndex]=t;

  const matNameToTex={};
  for(const m of materials||[]){
    const idx=m.index;
    if(matTexMap && matTexMap[idx]!==undefined){
      const tIdx=matTexMap[idx];
      const t=allTexturesByIndex[tIdx];
      if(t){
        const nameKey=(m.name||m.fileName||'').toLowerCase().replace(/[^a-z0-9]/g,'');
        matNameToTex[nameKey]={texture:t.texture,format:t.format||''};
      }
    }
  }

  let threeBones=[];
  let boneNameToThree={};

  if(armatureData&&armatureData.bones&&armatureData.bones.length>0){
    const bones=armatureData.bones;
    for(let i=0;i<bones.length;i++){
      const b=new THREE.Bone();
      b.name=bones[i].name;
      threeBones.push(b);
      boneNameToThree[b.name]=b;
    }
    for(let i=0;i<bones.length;i++){
      const bd=bones[i];
      const bone=threeBones[i];
      if(bd.parent&&boneNameToThree[bd.parent]){
        boneNameToThree[bd.parent].add(bone);
      }
    }

    const worldBindPoses=new Map();
    for(let i=0;i<bones.length;i++){
      const bd=bones[i];
      if(bd.bindPoseInverse){
        const m=new THREE.Matrix4();
        m.fromArray(bd.bindPoseInverse);
        m.invert();
        worldBindPoses.set(bd.name,m);
      }
    }

    function setBoneLocalFromWorld(bone,parentWorld){
      const wbp=worldBindPoses.get(bone.name);
      if(wbp){
        const localMat=new THREE.Matrix4();
        localMat.copy(parentWorld).invert().multiply(wbp);
        const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
        localMat.decompose(p,q,s);
        bone.position.copy(p);
        bone.quaternion.copy(q);
        bone.scale.copy(s);
      }
      const thisWorld=wbp||parentWorld;
      for(const child of bone.children){
        if(child.isBone)setBoneLocalFromWorld(child,thisWorld);
      }
    }

    const rootBones=threeBones.filter(b=>!(b.parent&&b.parent.isBone));
    const identity=new THREE.Matrix4();
    for(const root of rootBones){
      setBoneLocalFromWorld(root,identity);
      modelGroup.add(root);
    }

    currentSkeleton=new THREE.Skeleton(threeBones);
  }

  const hasSkinData=allMeshes.some(m=>m.skinIndices);

  for(const m of allMeshes){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(m.positions,3));
    if(m.uvs.length>0) geo.setAttribute('uv',new THREE.Float32BufferAttribute(m.uvs,2));
    geo.setIndex(new THREE.BufferAttribute(m.indices,1));
    geo.computeVertexNormals();

    let tex=null,texFmt='';
    if(texList.length>0){
      const mRef=m.materialRef;
      const matName=(m.displayName||m.name||'').toLowerCase();
      const matNameClean=matName.replace(/[^a-z0-9]/g,'');
      
      if(matTexMap && matTexMap[mRef]!==undefined){
        const tIdx=matTexMap[mRef];
        const t=allTexturesByIndex[tIdx];
        if(t){tex=t.texture;texFmt=t.format||'';}
      }
      if(!tex && matNameToTex[matNameClean]){
        const found=matNameToTex[matNameClean];tex=found.texture;texFmt=found.format||'';
      }
      if(!tex){
        const found=textureMap[matNameClean]||textureMap[m.name];
        if(found){tex=found.texture;texFmt=found.format||'';}
      }
      if(!tex){
        const found=textureMap[matNameClean.toLowerCase()];
        if(found){tex=found.texture;texFmt=found.format||'';}
      }
      if(!tex){
        const candidate=diffuseTextures[mRef];
        if(candidate){tex=candidate.texture;texFmt=candidate.format||'';}
      }
      if(!tex){
        for(const t of texList){
          if(t.slot===0 && t.hash && matName.includes(t.hash.substring(0,6))){
            tex=t.texture;texFmt=t.format||'';break;
          }
        }
      }
      if(!tex && diffuseTextures.length>0){
        tex=diffuseTextures[0].texture;texFmt=diffuseTextures[0].format||'';
      }
    }

    const matOpts={color:tex?0xffffff:0x999999,metalness:0.1,roughness:0.7,side:THREE.DoubleSide,flatShading:true};
    if(tex){matOpts.map=tex;}
    if(isWireframe){matOpts.wireframe=true;matOpts.color=new THREE.Color(0x00e5ff);}
    const mat=new THREE.MeshStandardMaterial(matOpts);

    let mesh;
    if(currentSkeleton&&m.skinIndices&&m.skinWeights){
      geo.setAttribute('skinIndex',new THREE.Uint8BufferAttribute(m.skinIndices,4));
      geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(m.skinWeights,4));
      mesh=new THREE.SkinnedMesh(geo,mat);
      mesh.bind(currentSkeleton);
    } else {
      mesh=new THREE.Mesh(geo,mat);
    }
    mesh.name=m.displayName||m.name||'primitive';
    modelGroup.add(mesh);
    totalVerts+=m.positions.length/3;
    totalTris+=m.indices.length/3;
  }

  const box=new THREE.Box3().setFromObject(modelGroup);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z,0.001);
  const scale=2.0/maxDim;
  modelGroup.scale.setScalar(scale);
  modelGroup.position.sub(center.clone().multiplyScalar(scale));
  scene.add(modelGroup);

  if(currentSkeleton){
    scene.updateMatrixWorld(true);
    const bonePositions=[];
    const boneColors=[];
    const jointPositions=[];
    function collectBones(obj){
      if(obj.isBone){
        obj.updateWorldMatrix(true,false);
        const wp=new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld);
        jointPositions.push(wp.x,wp.y,wp.z);
        if(obj.parent&&obj.parent.isBone){
          const pp=new THREE.Vector3().setFromMatrixPosition(obj.parent.matrixWorld);
          bonePositions.push(wp.x,wp.y,wp.z,pp.x,pp.y,pp.z);
          boneColors.push(1,0.55,0,1,0.55,0);
        }
      }
      for(const c of obj.children) collectBones(c);
    }
    collectBones(modelGroup);
    if(bonePositions.length>0){
      const bGeo=new THREE.BufferGeometry();
      bGeo.setAttribute('position',new THREE.Float32BufferAttribute(bonePositions,3));
      bGeo.setAttribute('color',new THREE.Float32BufferAttribute(boneColors,3));
      const bMat=new THREE.LineBasicMaterial({color:0xff8c00,linewidth:2,vertexColors:true});
      boneHelper=new THREE.LineSegments(bGeo,bMat);
      isBonesVisible=true;
      boneHelper.visible=true;
      scene.add(boneHelper);
      console.log('Bone vis:',bonePositions.length/3,'line segments from',currentSkeleton.bones.length,'bones');
    }
    if(jointPositions.length>0){
      const jGeo=new THREE.BufferGeometry();
      jGeo.setAttribute('position',new THREE.Float32BufferAttribute(jointPositions,3));
      const jMat=new THREE.PointsMaterial({color:0x00ff88,size:0.03,sizeAttenuation:true});
      const jointDots=new THREE.Points(jGeo,jMat);
      boneHelper.add(jointDots);
    }
  }

  radius=maxDim*scale*2.5;
  targetY=0;theta=0;phi=Math.PI/4;
  updateCamera();
  const texCount=Object.keys(textureMap).length;
  const boneCount=currentSkeleton?currentSkeleton.bones.length:0;
  let stats=totalVerts+' verts \u00b7 '+totalTris+' tris \u00b7 '+allMeshes.length+' parts';
  if(texCount)stats+=' \u00b7 '+texCount+' textures';
  if(boneCount)stats+=' \u00b7 '+boneCount+' bones';
  document.getElementById('info').textContent=stats;
  updateButtonStates();
}

function toggleWireframe(){
  isWireframe=!isWireframe;
  if(modelGroup)modelGroup.traverse(c=>{
    if(c.isMesh&&c.material){
      c.material.wireframe=isWireframe;
      if(isWireframe){c.material.color.set(0x00e5ff);}
      else{c.material.color.set(c.material.map?0xffffff:0x999999);}
    }
  });
  updateButtonStates();
}
function toggleSpin(){isSpinning=!isSpinning;updateButtonStates();}
function toggleBones(){
  isBonesVisible=!isBonesVisible;
  if(boneHelper){
    boneHelper.visible=isBonesVisible;
    if(isBonesVisible) rebuildBoneVis();
  }
  updateButtonStates();
}
function toggleGrid(){

// ── Load character ──
function createFallbackTexture(name){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const ctx=c.getContext('2d');ctx.fillStyle='#888';ctx.fillRect(0,0,256,256);
  ctx.fillStyle='#111';ctx.font='14px sans-serif';ctx.fillText(name||'Fallback',10,30);
  const t=new THREE.CanvasTexture(c);t.flipY=false;return t;
}

async function loadCharacter(id,name){
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector('[data-id="'+id+'"]');
  if(btn)btn.classList.add('active');
  document.getElementById('loading').textContent='Loading '+name+'...';
  document.getElementById('modelName').textContent=name;
  document.getElementById('info').textContent='';
  showViewer();
  try{
    const r=await fetch(API_BASE_URL+'/api/character?id='+encodeURIComponent(id));
    const d=await r.json();
    if(d.error){document.getElementById('loading').textContent='Error: '+d.error;return;}
    document.getElementById('loading').textContent='Decoding...';
    const textureMap={};
    for(const t of d.textures||[]){
      let canvas;
      if(t.png_data){
        const img=new Image();
        await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='data:image/png;base64,'+t.png_data;});
        canvas=document.createElement('canvas');canvas.width=t.width||img.width;canvas.height=t.height||img.height;
        canvas.getContext('2d').drawImage(img,0,0);
      } else {
        const raw=Uint8Array.from(atob(t.data),c=>c.charCodeAt(0));
        try{canvas=decodeTextureToCanvas(raw,t.width,t.height,t.format);}catch(e){canvas=createFallbackTexture(t.format);}
      }
      const tex=new THREE.CanvasTexture(canvas);
      tex.flipY=false;
      tex.wrapS=THREE.RepeatWrapping;
      tex.wrapT=THREE.RepeatWrapping;
      if(THREE.SRGBColorSpace)tex.colorSpace=THREE.SRGBColorSpace;
      else if(THREE.sRGBEncoding)tex.encoding=THREE.sRGBEncoding;
      tex.needsUpdate=true;
      textureMap[t.hash]={texture:tex,width:t.width,height:t.height,size:t.size,format:t.format,slot:t.slot,mtbIndex:t.mtbIndex};
    }
    let allMeshes=[];
    for(const g of d.groups||[]){
      allMeshes=allMeshes.concat(decodeGroup(g.vbuf,g.ibuf,g.primitives,g.skinIndices,g.skinWeights));
    }
    buildModel(allMeshes,textureMap,d.materials||[],d.matTexMap||{},d.armature||null);
    currentModelData={type:'character',id:id,name:name,data:d,allMeshes,textureMap};
    document.getElementById('loading').textContent='';
  }catch(e){document.getElementById('loading').textContent='Error: '+e.message;}
}

function reloadCurrentModel(){

function exportGLTF(){
  if(!modelGroup){alert('No model loaded');return;}
  document.getElementById('loading').textContent='Exporting glTF...';
  showViewer();
  try{
    const allMeshes=[];
    modelGroup.traverse(c=>{if(c.isMesh&&c.geometry)allMeshes.push(c);});
    if(allMeshes.length===0){document.getElementById('loading').textContent='No meshes';return;}
    const bufferParts=[];
    const accessors=[];const bufferViews=[];const gltfMeshes=[];const gltfMaterials=[];const gltfTextures=[];const gltfImages=[];const samplers=[{magFilter:9729,minFilter:9987,wrapS:10497,wrapT:10497}];
    let byteOffset=0;
    const texMap=new Map();let matIdx=0;
    const gltfNodes=[];const nodeIdxMap=new Map();
    let skinIdx=-1;
    const skinnedMeshes=allMeshes.filter(m=>m.isSkinnedMesh);
    const unskinnedMeshes=allMeshes.filter(m=>!m.isSkinnedMesh);
    function pad4(){
      const rem=byteOffset%4;
      if(rem>0){const pad=new Uint8Array(4-rem);bufferParts.push(pad);byteOffset+=4-rem;}
    }
    if(skinnedMeshes.length>0){
      const sk=skinnedMeshes[0].skeleton;
      const bones=sk.bones;
      const boneInverses=sk.boneInverses;
      const boneNames=bones.map(b=>b.name);
      const jointIndices=new Map();
      bones.forEach((b,i)=>jointIndices.set(b.uuid,i));
      const boneNodeStart=gltfNodes.length;

function importGLTF(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  document.getElementById('loading').textContent='Importing: '+file.name+'...';
  document.getElementById('modelName').textContent=file.name;
  showViewer();
  const reader=new FileReader();
  const isGLB=file.name.toLowerCase().endsWith('.glb');
  function processGLTF(gltf,binBuf){
    if(!gltf.meshes||!gltf.accessors||!gltf.bufferViews){throw new Error('Invalid glTF');}
    let binData=binBuf;
    if(!binData&&gltf.buffers&&gltf.buffers[0]&&gltf.buffers[0].uri){
      const uri=gltf.buffers[0].uri;
      if(uri.startsWith('data:')){
        const b64=uri.split(',')[1];
        const raw=atob(b64);binData=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)binData[i]=raw.charCodeAt(i);
      }

    if(!binData)throw new Error('No buffer data found');
    const rawBuf=binData.buffer;
    const rawOff=binData.byteOffset||0;
    function readAccessor(acc){
      const bv=gltf.bufferViews[acc.bufferView];
      const baseOff=rawOff+(bv.byteOffset||0)+(acc.byteOffset||0);
      const stride=bv.byteStride||0;
      const count=acc.count;const ct=acc.componentType;const type=acc.type;
      const comps={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4};
      const n=comps[type]||1;
      const elSize=ct===5126?4:ct===5125?4:2;
      function readEl(idx){
        const elOff=stride?baseOff+idx*stride:baseOff+idx*n*elSize;
        const dv=new DataView(rawBuf,elOff);
        if(ct===5126){
          const r=[];for(let j=0;j<n;j++)r.push(dv.getFloat32(j*4,true));return r;
        }else if(ct===5125){
          const r=[];for(let j=0;j<n;j++)r.push(dv.getUint32(j*4,true));return r;
        }else{
          const r=[];for(let j=0;j<n;j++)r.push(dv.getUint16(j*2,true));return r;
        }
      }
      if(type==='SCALAR'){
        const r=[];for(let i=0;i<count;i++)r.push(...readEl(i));
        return new (ct===5125?Uint32Array:ct===5123?Uint16Array:Float32Array)(r);
      }
      const r=new Float32Array(count*n);
      for(let i=0;i<count;i++){const el=readEl(i);for(let j=0;j<n;j++)r[i*n+j]=el[j];}
      return r;
    }
    if(modelGroup){
      scene.remove(modelGroup);
      modelGroup.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose();}});
    }
    modelGroup=new THREE.Group();
    let totalVerts=0,totalTris=0;
    for(const gm of gltf.meshes){
      for(const prim of gm.primitives){
        const geo=new THREE.BufferGeometry();
        if(prim.attributes.POSITION!==undefined){
          const p=readAccessor(gltf.accessors[prim.attributes.POSITION]);
          geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
        }
        if(prim.attributes.NORMAL!==undefined){
          const nm=readAccessor(gltf.accessors[prim.attributes.NORMAL]);
          geo.setAttribute('normal',new THREE.Float32BufferAttribute(nm,3));
        }
        if(prim.attributes.TEXCOORD_0!==undefined){
          const uv=readAccessor(gltf.accessors[prim.attributes.TEXCOORD_0]);
          geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
        }
        if(prim.indices!==undefined){
          geo.setIndex(new THREE.BufferAttribute(readAccessor(gltf.accessors[prim.indices]),1));
        }
        geo.computeVertexNormals();
        const matOpts={color:0xffffff,metalness:0.1,roughness:0.7,side:THREE.DoubleSide,flatShading:true};
        if(prim.material!==undefined&&gltf.materials&&gltf.materials[prim.material]){
          const mtl=gltf.materials[prim.material];
          if(mtl.pbrMetallicRoughness){
            if(mtl.pbrMetallicRoughness.metallicFactor!==undefined)matOpts.metalness=mtl.pbrMetallicRoughness.metallicFactor;
            if(mtl.pbrMetallicRoughness.roughnessFactor!==undefined)matOpts.roughness=mtl.pbrMetallicRoughness.roughnessFactor;
          }
          if(mtl.pbrMetallicRoughness&&mtl.pbrMetallicRoughness.baseColorTexture){
            const texInfo=mtl.pbrMetallicRoughness.baseColorTexture;
            if(gltf.textures&&gltf.textures[texInfo.index]){
              const imgIdx=gltf.textures[texInfo.index].source;
              if(gltf.images&&gltf.images[imgIdx]){
                const imgSrc=gltf.images[imgIdx];
                const imgData=imgSrc.uri||('data:image/png;base64,'+(binData?btoa(String.fromCharCode.apply(null,binData.subarray(imgSrc.bufferView!==undefined?(gltf.bufferViews[imgSrc.bufferView].byteOffset||0):0,(gltf.bufferViews[imgSrc.bufferView].byteOffset||0)+(gltf.bufferViews[imgSrc.bufferView].byteLength||0)))):''));

          }
